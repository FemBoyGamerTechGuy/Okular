name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  selfhost:
    name: Build (zero C) + self-reproduction + full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE product path: no C compiler, no as, no ld. The committed native
      # seed (bin/okular) compiles the compiler from source; the result must
      # reproduce the seed byte-identically and pass the full suite.
      - name: Build the Okular compiler with the native seed (zero C)
        run: make

      - name: Self-reproduction + full differential suite
        run: bash tools/run_selfbuild_check.sh

      - name: Formatting check (okular fmt --check)
        run: |
          build/okular fmt --check \
            selfhost/compiler/main.ok selfhost/compiler/src/*.ok \
            stdlib/*.ok examples/*/main.ok

  arm64:
    name: ARM64 backend + differential execution under the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the compiler (C-free)
        run: make

      # Every positive suite case re-compiled with --target arm64 and
      # EXECUTED under tools/emu64.py: stdout and exit codes must match
      # the x86-64 expectations exactly. The emulator is a test tool
      # (python3), not a build dependency.
      - name: ARM64 differential suite (executed, not just assembled)
        run: bash tools/run_arm64_tests.sh

      # The decisive ARM64 test: the compiler itself cross-compiled to
      # aarch64, then EXECUTED under the emulator to compile a program;
      # the produced executable is run natively.
      - name: Self-cross-compilation (the arm64 compiler compiles, emulated)
        run: |
          make arm64
          mkdir -p build/selfarm/hello
          printf 'type.text=1\n\nwrite("self-compiled on ARM64")\nprint\n' > build/selfarm/hello/main.ok
          cd build/selfarm/hello
          echo "self-cross: the emulated aarch64 compiler compiles hello (~8 min)..."
          timeout 1800 python3 ../../../tools/emu64.py ../../../build/okular-arm64 main.ok --out ./hello
          OUT="$(./hello)"
          if [ "$OUT" != "self-compiled on ARM64" ]; then
            echo "arm64 self-cross-compilation FAILED — hello printed: $OUT" >&2
            exit 1
          fi
          echo "arm64 self-cross-compilation OK: $OUT"

  arm64-native:
    name: Native ARM64 hardware (real aarch64 runner, no emulator)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The committed seed (bin/okular) is an x86-64 binary; qemu-user-static
      # lets this aarch64 host run it for the one bootstrap step. Everything
      # produced for arm64 afterwards runs NATIVELY — the results below are
      # real hardware executions, not emulations.
      - name: "Install qemu-user (bootstrap only — the seed is x86-64)"
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Cross-build the ARM64 compiler (seed under qemu)
        run: timeout 1800 make arm64

      # diagnostics: the qemu-built binary must be byte-identical to the
      # deterministic local build (md5 recorded by the maintainer); and
      # one traced compile shows how far the native compiler gets before
      # any hang, with the last emitted function in the log
      - name: Diagnostics (binary hash + strace + traced compile)
        run: |
          md5sum build/okular-arm64
          sudo apt-get install -y strace >/dev/null 2>&1 || true
          mkdir -p build/diag/hello
          printf 'type.text=1\n\nwrite("diag")\nprint\n' > build/diag/hello/main.ok
          cd build/diag/hello
          echo "--- traced compile (--trace-emit): the last phase reached ---"
          timeout 60 ../../../build/okular-arm64 main.ok --target arm64 --out ./diag --trace-emit 2> trace.log || true
          echo "trace lines: $(wc -l < trace.log)"; tail -5 trace.log || true
          echo "--- strace: the last syscalls before the hang ---"
          timeout 60 strace -f -o strace.out ../../../build/okular-arm64 main.ok --target arm64 --out ./diag2 || true
          tail -30 strace.out || true
          echo "--- result ---"
          ls -la ./
          cd "$GITHUB_WORKSPACE"

      # small programs first: the full positive suite, compiled by the
      # aarch64 compiler running natively AND executed natively — stdout
      # and exit codes must match the x86-64 expectations exactly
      - name: Full ARM64 differential suite (native compile + native execution)
        run: timeout 1800 env OKC=$PWD/build/okular-arm64 ARM64_RUN=native bash tools/run_arm64_tests.sh

      - name: The ARM64 compiler as a product, natively
        run: |
          cd examples/hello
          ../../build/okular-arm64 main.ok --target arm64
          OUT="$(./build/output/main)"
          if [ "$OUT" != "Hello Okular" ]; then
            echo "native arm64 product test FAILED — hello printed: $OUT" >&2
            exit 1
          fi
          echo "native arm64 product test OK: $OUT"

      # the big one last: the compiler compiles ITSELF on real hardware
      # and must reproduce byte-identically
      - name: ARM64 self-compilation fixed point on real hardware
        run: |
          mkdir -p build/armfix
          echo "native fixed point: compiling the compiler with itself (aarch64)..."
          timeout 900 bash -c 'cd selfhost/compiler && ../../build/okular-arm64 main.ok --target arm64 --out ../../build/armfix/okular-arm64'
          echo "native fixed point: compile done, comparing bytes..."
          cmp build/okular-arm64 build/armfix/okular-arm64
          echo "arm64 fixed point on native hardware: byte-identical self-compilation"

  lsp:
    name: LSP protocol suite (okular lsp over stdio JSON-RPC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the compiler (C-free)
        run: make

      # A real JSON-RPC 2.0 client drives the server through the full
      # contract: lifecycle, document sync, diagnostics (0-based lines,
      # UTF-16 characters), hover signatures, and the robustness clause
      # (malformed anything degrades to an error response, never a
      # crash). python3 is a test tool, not a build dependency.
      - name: LSP protocol tests
        run: bash tools/run_lsp_tests.sh

  release-package:
    name: Package and test the real product (x86-64 and arm64)
    runs-on: ubuntu-latest
    needs: [selfhost, arm64, arm64-native, lsp]
    steps:
      - uses: actions/checkout@v4

      - name: Build both compilers (C-free) and package both distributions
        run: |
          make
          make arm64
          bash tools/package_release.sh

      - name: Upload the compiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: okular-release-archives
          path: build/release/*.tar.gz
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: okular-release-checksums
          path: build/release/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release (tags only)
    runs-on: ubuntu-latest
    needs: release-package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the release archives
        uses: actions/download-artifact@v4
        with:
          name: okular-release-archives
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: okular-release-checksums
          path: dist

      - name: Create the release with the compiler binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          body: |
            **Okular ${{ github.ref_name }}** — native compiler for linux-x86-64 and linux-arm64.

            Download `okular-${{ github.ref_name }}-linux-x86_64.tar.gz` (or
            `okular-${{ github.ref_name }}-linux-arm64.tar.gz` for ARM64
            hardware), unpack, and compile your first program:

                tar xzf okular-${{ github.ref_name }}-linux-x86_64.tar.gz
                cd okular-${{ github.ref_name }}-linux-x86_64/examples/hello
                ../../bin/okular main.ok
                ./build/output/main

            One native executable per target. No C compiler, no `as`, no
            `ld`, no bootstrap required — the compiler emits standalone
            ELF64 binaries directly, for x86-64 and aarch64 alike
            (`--target arm64` / `--target x86-64` cross-compiles either
            way from either distribution).
