name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  selfhost:
    name: C-free build + self-reproduction + differential suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE product path: no C compiler, no as, no ld. The committed native
      # seed (bin/okular) compiles the compiler from source; the result must
      # reproduce the seed byte-identically and pass the full suite.
      - name: Build the Okular compiler with the native seed (zero C)
        run: make

      - name: Self-reproduction + 187-case differential suite
        run: bash tools/run_selfbuild_check.sh

  c-differential:
    name: Legacy C bootstrap differential (transitional until M7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full legacy suite through the C bootstrap (560 checks)
        run: make test-c

      - name: M5 bootstrap chain (stage 0 -> 1 -> 2 -> 3 fixed point)
        run: bash tools/run_bootstrap_chain.sh

  release-package:
    name: Package and test the real product
    runs-on: ubuntu-latest
    needs: selfhost
    steps:
      - uses: actions/checkout@v4

      - name: Build the compiler (C-free) and package the distribution
        run: |
          make
          bash tools/package_release.sh

      - name: Upload the compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: okular-linux-x86_64
          path: build/release/*.tar.gz
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: okular-linux-x86_64-checksums
          path: build/release/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release (tags only)
    runs-on: ubuntu-latest
    needs: release-package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: okular-linux-x86_64
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: okular-linux-x86_64-checksums
          path: dist

      - name: Create the release with the compiler binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          body: |
            **Okular ${{ github.ref_name }}** — native compiler for linux-x86-64.

            Download `okular-${{ github.ref_name }}-linux-x86_64.tar.gz`,
            unpack, and compile your first program:

                tar xzf okular-${{ github.ref_name }}-linux-x86_64.tar.gz
                cd okular-${{ github.ref_name }}-linux-x86_64/examples/hello
                ../../bin/okular main.ok
                ./build/output/main

            One native executable. No C compiler, no `as`, no `ld`, no
            bootstrap required — the compiler emits standalone ELF64
            binaries directly.
